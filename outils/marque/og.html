<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Russo+One&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0}
#og{position:relative;width:1200px;height:630px;overflow:hidden;background:radial-gradient(ellipse 70% 80% at 50% 30%,#26262a 0%,#161618 60%,#0e0e10 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}

<div id="og"><img class="ic" src="/assets/brand/icon-512.png" width="200" height="200"><div class="wm">SCRIPT<span>URA</span></div><div class="tg">Crée du contenu <b>qui décolle vraiment.</b></div></div>
