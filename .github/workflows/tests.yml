name: Tests

# Sur chaque push (branche de feature ou main) : donne un signal vert/rouge
# visible sur GitHub AVANT de taper "Merge", sans changer le rituel de
# déploiement manuel (voir CLAUDE.md). Ne bloque rien automatiquement,
# c'est de la visibilité, pas une porte.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      # Le service de rendu a ses PROPRES dépendances (express), et
      # tests/montage-*.test.js charge render-service/server.js pour vérifier
      # ses calculs de durée et de sur-échantillonnage. Sans cette étape, ces
      # fichiers ne se chargent même pas ici : node_modules/ est ignoré par git,
      # donc le défaut n'apparaît QUE sur la CI, jamais en local.
      # Verrouillé par tests/dependances-du-service-de-rendu.test.js.
      - name: Installer les dépendances du service de rendu
        run: npm ci --prefix render-service

      - name: Installer Chromium (Playwright)
        run: npx playwright-core install --with-deps chromium

      # LE NOM DU TEST FAUTIF DOIT ÊTRE LISIBLE À LA FIN DU JOURNAL.
      # Trois échecs de CI de suite se sont présentés comme « 1 test sur 599 »
      # sans dire lequel : la sortie TAP nomme bien le coupable, mais au milieu
      # de quatre mille lignes, et la fin du journal ne montre que le décompte.
      # On rejoue donc les lignes d'échec à la fin, là où on les cherche.
      # `set -o pipefail` est indispensable : sans lui le code de sortie serait
      # celui de `tee`, donc toujours 0, et la CI passerait au vert avec des
      # tests rouges. C'est le pire des deux mondes.
      - name: Lancer la suite de tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee resultat.tap
        continue-on-error: true
        id: suite

      - name: Résumé des échecs
        if: always()
        shell: bash
        run: |
          echo "──────── TESTS EN ÉCHEC ────────"
          grep -E '^not ok' resultat.tap || echo "(aucun)"
          echo "────────────────────────────────"
          grep -E '^# (tests|pass|fail)' resultat.tap || true
          # On refait échouer le job ici : l'étape précédente laisse passer pour
          # que ce résumé s'affiche, mais un test rouge doit rester rouge.
          test "${{ steps.suite.outcome }}" = "success"
