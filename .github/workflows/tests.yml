name: Tests

# Sur chaque push (branche de feature ou main) : donne un signal vert/rouge
# visible sur GitHub AVANT de taper "Merge", sans changer le rituel de
# déploiement manuel (voir CLAUDE.md). Ne bloque rien automatiquement,
# c'est de la visibilité, pas une porte.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      # Le service de rendu a ses PROPRES dépendances (express), et
      # tests/montage-*.test.js charge render-service/server.js pour vérifier
      # ses calculs de durée et de sur-échantillonnage. Sans cette étape, ces
      # fichiers ne se chargent même pas ici : node_modules/ est ignoré par git,
      # donc le défaut n'apparaît QUE sur la CI, jamais en local.
      # Verrouillé par tests/dependances-du-service-de-rendu.test.js.
      - name: Installer les dépendances du service de rendu
        run: npm ci --prefix render-service

      - name: Installer Chromium (Playwright)
        run: npx playwright-core install --with-deps chromium

      - name: Lancer la suite de tests
        run: npm test
