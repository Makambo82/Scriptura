<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scriptura OS - Menu</title>
<style>
  /* Variables de base pour assurer le rendu du test */
  :root {
    --border-soft: rgba(255, 255, 255, 0.1);
    --bg-sidebar: #1e1e1e;
    --bg-body: #121212;
  }

  /* Style global pour la page de test */
  body {
    margin: 0;
    font-family: 'Tenor Sans', sans-serif;
    background-color: var(--bg-body);
    color: white;
    display: flex;
    height: 100vh;
  }

  /* Structure du menu latéral */
  .sidebar {
    width: 250px;
    background-color: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-soft);
    padding: 16px;
    box-sizing: border-box;
  }

  .sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .sidebar-logo {
    font-size: 1.2rem;
    font-weight: bold;
  }

  .sidebar-close {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 1.2rem;
  }

  /* Zone de navigation centrale prenant tout l'espace disponible */
  .sidebar-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* Boutons du menu (alignement à gauche forcé) */
  .sidebar-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    background: transparent;
    border: none;
    text-align: left;
    width: 100%;
    color: rgba(255,255,255,0.85);
    font-family: 'Tenor Sans', sans-serif;
    font-size: 0.95rem;
    padding: 14px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
    box-sizing: border-box;
  }

  .sidebar-item:hover {
    background: rgba(255,255,255,0.05);
  }

  /* Zone du bas isolée */
  .sidebar-bottom {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border-soft);
  }

  /* Bouton spécifique de déconnexion */
  .sidebar-logout {
    color: rgba(239, 68, 68, 0.85);
  }

  .sidebar-logout:hover {
    background: rgba(239, 68, 68, 0.1);
  }

  /* Zone de contenu principal pour visualiser l'intégration */
  .main-content {
    flex: 1;
    padding: 40px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

  <!-- Menu latéral -->
  <div class="sidebar active">
    <div class="sidebar-header">
      <div class="sidebar-logo">Scriptura <em>OS</em></div>
      <button class="sidebar-close">✕</button>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="sidebar-item">
        <span class="sidebar-icon">🏠</span> Accueil
      </a>
      <a href="#" class="sidebar-item">
        <span class="sidebar-icon">⚙️</span> Paramètres
      </a>
    </nav>

    <div class="sidebar-bottom">
      <button class="sidebar-item sidebar-logout">
        <span class="sidebar-icon">🚪</span> Se déconnecter
      </button>
    </div>
  </div>

  <!-- Contenu principal -->
  <div class="main-content">
    <h1>Espace de travail</h1>
    <p>Le menu est maintenant structuré avec flexbox. Le bouton de déconnexion reste fixé en bas.</p>
  </div>

</body>
</html>
